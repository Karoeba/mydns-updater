services:
  test:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mydns-updater-test:local
    network_mode: none
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - ./:/suite:ro
      - ../update.sh:/source/update.sh:ro
      - ../lib:/source/lib:ro
      - ./reports:/reports
    command: ["sh", "/suite/entrypoint.sh"]
