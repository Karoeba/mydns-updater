services:
  mydns-updater:
    build: .
    image: mydns-updater:local
    container_name: mydns-updater
    restart: unless-stopped
    volumes:
      - ./update.sh:/app/update.sh:ro
      - ./lib:/app/lib:ro
      - ./config:/config:ro
      - ./state:/state
    command: ["sh", "/app/update.sh"]
    healthcheck:
      test: ["CMD", "sh", "/app/update.sh", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
