name: Docker tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Alpine mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run mock tests
        run: |
          mkdir -p tests/reports
          docker compose -f tests/compose.yaml config --quiet
          docker compose -f tests/compose.yaml run --build --rm test
          grep -Fxq 'ALL TESTS PASSED' tests/reports/result.txt

      - name: Test host-side configuration replacement
        run: sh tests/test-config-reload.sh | tee tests/reports/config-reload.log

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            tests/reports/test.log
            tests/reports/result.txt
            tests/reports/config-reload.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up test containers
        if: always()
        run: docker compose -f tests/compose.yaml down

  linux:
    name: Linux direct execution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test without Docker
        run: |
          sh tests/test-linux.sh
          sh tests/test-healthcheck-linux.sh
          sh tests/test-health-monitor.sh
          sh tests/test-health-recovery.sh
      - name: Validate service unit
        run: systemd-analyze verify deploy/linux/*.service deploy/linux/*.timer
      - name: Test real systemd scheduling
        run: |
          sudo --preserve-env=GITHUB_ACTIONS sh tests/test-monitor-systemd.sh
          sudo --preserve-env=GITHUB_ACTIONS sh tests/test-recovery-systemd.sh

  docs:
    name: Documentation shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Parse documented shell commands without executing them
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          count = 0
          failures = []
          paths = [Path("README.md"), *sorted(Path("docs").rglob("*.md"))]
          for path in paths:
              source = path.read_text(encoding="utf-8")
              for match in re.finditer(r"^```(sh|bash)\n(.*?)^```[ \t]*$", source, re.M | re.S):
                  count += 1
                  line = source.count("\n", 0, match.start()) + 1
                  shells = ["sh", "bash"] if match[1] == "sh" else ["bash"]
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".sh", encoding="utf-8") as script:
                      script.write(match[2])
                      script.flush()
                      for shell in shells:
                          result = subprocess.run([shell, "-n", script.name], capture_output=True, text=True)
                          if result.returncode:
                              failures.append(f"{path}:{line} ({shell}): {result.stderr.strip()}")
          for failure in failures:
              print(failure)
          print(f"Checked {count} documented shell blocks; failures={len(failures)}")
          if count == 0 or failures:
              raise SystemExit(1)
          PY

  recovery-semantics:
    name: Docker recovery behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check stop and restart behavior with isolated containers
        run: sh tests/test-docker-recovery-semantics.sh

  recovery-cooperative:
    name: Recovery experiment (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        engine: [runner, "24.0.2"]
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test runner Docker
        if: matrix.engine == 'runner'
        run: sh tests/test-docker-cooperative-recovery.sh
      - name: Test isolated Docker 24.0.2 daemon
        if: matrix.engine == '24.0.2'
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker create --privileged -e DOCKER_TLS_CERTDIR= docker:24.0.2-dind)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker start "$cid"
          for attempt in $(seq 1 60); do
            if docker exec "$cid" docker info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$cid" docker info >/dev/null
          docker cp tests/test-docker-cooperative-recovery.sh "$cid":/tmp/probe.sh
          docker exec -e GITHUB_ACTIONS=true "$cid" sh /tmp/probe.sh
